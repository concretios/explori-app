<template>
    <lightning-card title="Explori Setup">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium wrap">
            <div class="slds-m-bottom_medium status">
                <template lwc:if={configured}>
                    <lightning-badge label="Share ID saved" class="slds-theme_success"></lightning-badge>
                </template>
                <template lwc:else>
                    <lightning-badge label="Share ID not saved" class="slds-theme_warning"></lightning-badge>
                </template>
                <lightning-helptext
                    class="slds-m-left_xx-small"
                    content="A saved Share ID is stored in a protected setting and is never shown again on this page.">
                </lightning-helptext>
            </div>

            <p class="slds-text-body_small slds-m-bottom_small help">
                Paste the Share ID from Explori. If a Share ID is already saved, type a new one to replace it.
            </p>
            <p class="slds-text-body_small slds-m-bottom_medium help">
                Product ID is optional. Leave it blank unless Explori gave you one.
            </p>

            <div class="slds-form-element">
                <label class="slds-form-element__label" for="shareId">
                    <abbr class="slds-required" title="required">*</abbr>
                    Share ID
                </label>
                <lightning-helptext
                    content="Required to save. Stored in a protected custom setting. Salesforce will not display the saved value after you save.">
                </lightning-helptext>
                <lightning-input
                    id="shareId"
                    type="password"
                    label="Share ID"
                    variant="label-hidden"
                    value={shareId}
                    onchange={handleShareId}
                    autocomplete="new-password">
                </lightning-input>
            </div>

            <div class="slds-form-element slds-m-top_small">
                <label class="slds-form-element__label" for="productId">
                    Product ID
                </label>
                <lightning-helptext
                    content="Optional. Maximum 50 characters. Letters, numbers, dot, underscore, and hyphen only.">
                </lightning-helptext>
                <lightning-input
                    id="productId"
                    label="Product ID"
                    variant="label-hidden"
                    value={productId}
                    onchange={handleProductId}
                    maxlength="50">
                </lightning-input>
            </div>

            <div class="slds-m-top_medium">
                <lightning-button
                    variant="brand"
                    label="Save"
                    disabled={saveDisabled}
                    onclick={handleSave}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
